services:
  octopus:
    privileged: true
    ports:
      - "8083:8080"
      - "10943:10943"
    environment:
      ADMIN_API_KEY: API-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: octopusguides@gmail.com
      ADMIN_PASSWORD: Password01!
      ACCEPT_EULA: Y
      DB_CONNECTION_STRING: Server=mssql,1433;Database=Octopus;User Id=SA;Password=Password01!;ConnectRetryCount=6
      CONNSTRING: Server=mssql,1433;Database=Octopus;User Id=SA;Password=Password01!;ConnectRetryCount=6
      MASTER_KEY: 6EdU6IWsCtMEwk0kPKflQQ==
    image: octopusdeploy/octopusdeploy
    pull_policy: always
    labels:
      autoheal: true
    depends_on:
      - mssql
    networks:
      - octopus
  mssql:
    ports:
      - "1433:1433"
    pull_policy: always
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Password01!
      MSSQL_PID: Express
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks:
      - octopus
#    volumes:
#      - sqlvolume:/var/opt/mssql
networks:
  octopus:
    name: octopus
volumes:
  sqlvolume:
