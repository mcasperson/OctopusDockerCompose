services:
  tentacle:
    privileged: true
    image: octopusdeploy/tentacle
    environment:
      ServerApiKey: API-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      TargetEnvironment: OnSite
      TargetRole: apphost,db
      ServerUrl: http://octopus:8080
      ServerPort: 10943
      ACCEPT_EULA: !!str Y
    networks:
      - octopus
networks:
  octopus:
    name: octopus